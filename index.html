<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nest Aura Decor | End-to-end Interiors</title>
    <meta name="description" content="Nest Aura Decor creates interiors with an aura of their own, designed and built under one roof, from the first sketch to the final detail." />
    <meta name="theme-color" content="#C2A788" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nest Aura Decor" />
    <meta property="og:title" content="Nest Aura Decor | End-to-end Interiors" />
    <meta property="og:description" content="Interiors with an aura of their own, designed and built under one roof, from the first sketch to the final detail." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The hero photo and the two faces used above the fold start downloading
         with the script, instead of after the page has rendered. -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
          imagesrcset="/media/hero-room-900.avif 900w, /media/hero-room-1500.avif 1500w, /media/hero-room-2400.avif 2400w" imagesizes="100vw" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/distrampler.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/helvetica-neue-light.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- The page arrives prerendered, so fade the hero photo in as soon as it
         has loaded rather than waiting for the script (1.2s fallback, as in
         Hero.tsx). The class sits on <html>, outside what React manages. -->
    <script>
      (function () {
        var img = document.querySelector('.hero__photo img')
        if (!img) return
        var done = function () { document.documentElement.classList.add('hero-photo-ready') }
        if (img.complete) done()
        else { img.addEventListener('load', done); img.addEventListener('error', done); setTimeout(done, 1200) }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
